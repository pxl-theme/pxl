name: Build

on:
  push:
    branches: ["main", "action-test"]
  pull_request:
    branches: ["main", "action-test"]

jobs:
  cache-and-install:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: latest
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      # - name: Test image formats
      #   run: |
